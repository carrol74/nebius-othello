[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nemothello-backend"
version = "0.1.0"
description = "Authoritative Othello game service for Nemothello"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3",
  "pydantic-settings>=2,<3", "httpx>=0.27,<1",
  "python-dotenv>=1,<2"
]

[project.scripts]
nemothello = "nemothello.cli:main"

[project.optional-dependencies]
research = [
  "numpy>=2,<3", "pytrio==0.2.9", "transformers>=4.57,<6",
  "modelscope>=1.20,<2", "torch>=2.6,<3"
]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=../.tmp/pytest"

[tool.ruff]
target-version = "py311"
line-length = 100
